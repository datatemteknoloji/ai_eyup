# ─────────────────────────────────────────────────────────────────────────
# PRODUCTION / MÜŞTERİ DAĞITIM STACK'İ (OFFLINE)
# ─────────────────────────────────────────────────────────────────────────
# Bu dosya deploy şablonudur. build-distribution.sh müşteri paketine
# docker-compose.yml adıyla kopyalar (standart compose dosya adı).
# Pakette kurulum:
#   docker compose up -d --no-build
#   # veya: sudo ./install-rhel.sh
#
# ÖNEMLİ: Bu dosyada `build:` YOKTUR. Müşteri paketinde imajlar
# images/*.tar.gz ile gelir; install-rhel.sh `docker load` eder.
# Kaynak derleme (internet/registry) için ayrı: docker-compose.build.yml
#
# Farklar (dev compose'a göre):
#  - Backend kaynak kodu host'tan mount edilmez, imaja gömülüdür (immutable).
#  - Üçüncü parti imajlar sabit versiyona pinlenmiştir (":latest" yok).
#  - pull_policy: never — registry'ye gitmez (air-gapped güvenli).
#  - RHEL/SELinux uyumluluğu için bind mount'larda :Z etiketi kullanılır.
#  - Frontend HTTPS (443) sunar, self-signed sertifika install-rhel.sh ile üretilir.
#  - DB/Redis portları sadece localhost'a bind edilir.
#  - Tüm kalıcı veri kökü ${DATA_DIR:-/data/data} altındadır.
#  - Dropt Level 1 sidecar: docker-compose.dropt.yml (include).
# ─────────────────────────────────────────────────────────────────────────

include:
  - path: docker-compose.dropt.yml

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:2.17.2-pg15
    pull_policy: never
    container_name: server_management_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: server_management
    command:
      - postgres
      - -c
      - log_line_prefix=%t [%p] 
      - -c
      - log_timezone=${TZ:-Europe/Istanbul}
      - -c
      - timezone=${TZ:-Europe/Istanbul}
      # Varsayılan max_connections=100, backend'in ana pool'u tek başına
      # (pool_size=40 + max_overflow=80=120) bunu aşıyor; üstüne arka plan
      # thread'leri (health check, log/inventory sync, NLQ collector, Windows
      # log — her biri NullPool ile ayrı bağlantı açan onlarca worker'a kadar
      # çıkabiliyor) ek bağlantı istiyor. 10.000+ sunucu ölçeğinde bu havuzların
      # aynı anda tepe yapması ihtimaline karşı pay artırıldı (300 -> 500).
      # Yetersiz kalırsa istekler "too many clients" hatası alır veya
      # pool_timeout=30s kadar donar — bkz. app/core/database.py. Bu değer
      # artırılınca container yeniden OLUŞTURULMALIDIR (`docker compose up -d
      # --force-recreate db`) — sadece `restart` postgres command'ını yenilemez.
      - -c
      - max_connections=500
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${DATA_DIR:-/data/data}/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    pull_policy: never
    container_name: server_management_redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DATA_DIR:-/data/data}/redis:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ainew-backend:latest}
    pull_policy: never
    container_name: server_management_backend
    restart: unless-stopped
    logging: *default-logging
    network_mode: "host"
    # .env dosyasındaki TÜM değişkenleri (AGENT_MODEL, AGENT_GUARD_*, REMOTE_LLM_* dahil)
    # container'a geçirir. Aşağıdaki `environment:` listesi sadece ${VAR} interpolasyonu
    # gerektiren veya zorunlu olan (SECRET_KEY, ADMIN_DEFAULT_PASSWORD) değerler için var —
    # aynı anahtar her ikisinde de varsa `environment:` kazanır, env_file sadece eksikleri
    # tamamlar. Yeni bir .env ayarı eklediğinizde artık burayı güncellemeniz gerekmez.
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@localhost:5432/server_management
      - REDIS_URL=redis://localhost:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-60}
      - PROMETHEUS_URL=http://localhost:9090
      - PUSHGATEWAY_URL=http://localhost:9091
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY .env dosyasinda tanimli olmali}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD .env dosyasinda tanimli olmali}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost,http://localhost}
      - APP_VERSION=${APP_VERSION:-}
      - AINEW_BRIDGE_SECRET=${AINEW_BRIDGE_SECRET:-}
      - DROPT_API_URL=${DROPT_API_URL:-http://127.0.0.1:8001}
      - DATA_DIR=${DATA_DIR:-/data/data}
      # Platform GUI güncelleme (admin): paket upload + update-rhel.sh host job
      - PLATFORM_UPDATE_ENABLED=${PLATFORM_UPDATE_ENABLED:-true}
      - AINEW_INSTALL_DIR=${AINEW_INSTALL_DIR:-/data}
      - AINEW_DATA_DIR=${DATA_DIR:-/data/data}
      - AINEW_UPDATES_DIR=/app/updates
      - DOCKER_SOCK=/var/run/docker.sock
      - PLATFORM_UPDATER_IMAGE=${PLATFORM_UPDATER_IMAGE:-alpine:3.20}
      # Tam DB yedek (Dropt dump) — host .env'den
      - DROPT_POSTGRES_USER=${DROPT_POSTGRES_USER:-dtt}
      - DROPT_POSTGRES_PASSWORD=${DROPT_POSTGRES_PASSWORD:-}
      - DROPT_POSTGRES_DB=${DROPT_POSTGRES_DB:-dttportal}
      - HOST_ETC_HOSTS=/host-etc-hosts
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
    volumes:
      - ./backend/static:/app/static:Z
      - ./VERSION:/app/VERSION:ro
      - ./prometheus/targets:/prometheus/targets:Z
      - ./prometheus/targets:/etc/prometheus/targets:Z
      - ${DATA_DIR:-/data/data}/chroma:/app/chroma:Z
      - ${DATA_DIR:-/data/data}/repos:/app/repos:Z
      - ${DATA_DIR:-/data/data}/uploads:/app/uploads:Z
      - ${DATA_DIR:-/data/data}/updates:/app/updates:Z
      # GUI self-update: host Docker API (ayrık updater container başlatır)
      - /var/run/docker.sock:/var/run/docker.sock
      # Opsiyonel: REMOTE_LLM_CA_BUNDLE için — self-signed/kurumsal CA PEM dosyanızı
      # ${DATA_DIR}/certs/ altına koyup .env'de REMOTE_LLM_CA_BUNDLE=/app/certs/<dosya>.pem
      # olarak belirtin (aynı dizin, install-rhel.sh'in ürettiği TLS sertifikasını da tutar).
      # TLS UI yönetimi: sertifika yazma + nginx reload
      - ${DATA_DIR:-/data/data}/certs:/app/certs:Z
      # AD / OpenShift hostname çözümlemesi — host OS /etc/hosts (dinamik)
      - /etc/hosts:/host-etc-hosts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker — toplu health check vb. (aynı backend imajı; ekstra tar gerekmez)
  worker:
    image: ${BACKEND_IMAGE:-ainew-backend:latest}
    pull_policy: never
    container_name: server_management_worker
    restart: unless-stopped
    logging: *default-logging
    network_mode: "host"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@localhost:5432/server_management
      - REDIS_URL=redis://localhost:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY .env dosyasinda tanimli olmali}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD .env dosyasinda tanimli olmali}
      - APP_VERSION=${APP_VERSION:-}
      - DATA_DIR=${DATA_DIR:-/data/data}
      - HOST_ETC_HOSTS=/host-etc-hosts
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
    volumes:
      - ./VERSION:/app/VERSION:ro
      - ./backend/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - ${DATA_DIR:-/data/data}/chroma:/app/chroma:Z
      - ${DATA_DIR:-/data/data}/repos:/app/repos:Z
      - ${DATA_DIR:-/data/data}/uploads:/app/uploads:Z
      - /etc/hosts:/host-etc-hosts:ro
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency", "2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    image: ${FRONTEND_IMAGE:-ainew-frontend:latest}
    pull_policy: never
    container_name: server_management_frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      TLS_CN: ${PRIMARY_IP:-localhost}
      TLS_IP: ${PRIMARY_IP:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:Z,ro
      # Yazılabilir: frontend entrypoint eksik server.crt/key için self-signed üretir
      - ${DATA_DIR:-/data/data}/certs:/etc/nginx/certs:Z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    pull_policy: never
    container_name: server_management_prometheus
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z,ro
      - ./prometheus/targets:/etc/prometheus/targets:Z
      - ${DATA_DIR:-/data/data}/prometheus:/prometheus:Z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  pushgateway:
    image: prom/pushgateway:v1.11.0
    pull_policy: never
    container_name: server_management_pushgateway
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (opsiyonel) — müşteride yerel LLM istenirse: docker compose --profile ollama -f docker-compose.prod.yml up -d
  ollama:
    image: ollama/ollama:latest
    pull_policy: never
    container_name: server_management_ollama
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - ${DATA_DIR:-/data/data}/ollama:/root/.ollama:Z
    profiles:
      - ollama

# Tarih-saat: log_format http context'te olmalı (conf.d include = http)
log_format timed '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log timed;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets - uzun cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dosya yükleme boyut limiti (PDF RAG için)
    client_max_body_size 100m;

    # WebSocket SSH Terminal — /api/v1/terminal/ws/ özel proxy (upgrade gerekli)
    location /api/v1/terminal/ws/ {
        proxy_pass http://host.docker.internal:8000/api/v1/terminal/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # KubeVirt serial console WS — /api/ Connection=$http_upgrade WS'i bozar;
    # terminal gibi Connection "upgrade" zorunlu (aksi halde backend 404).
    location ~ ^/api/v1/openshift/clusters/[0-9]+/kubevirt/vms/.+/console$ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Dropt Ops sidecar (Level 1) — /api/dropt/* → :8001/api/*
    location = /api/dropt/health {
        proxy_pass http://host.docker.internal:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/dropt/ {
        proxy_pass http://host.docker.internal:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 100m;
        proxy_buffering off;
    }

    # Dropt WebSocket — jobs + terminal
    location /api/dropt/jobs/ws/ {
        proxy_pass http://host.docker.internal:8001/api/jobs/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /api/dropt/terminal/ws/ {
        proxy_pass http://host.docker.internal:8001/api/terminal/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API proxy — backend'e yönlendir (CORS yok, tek origin)
    location /api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 100m;
        proxy_intercept_errors off;
        proxy_buffering off;
    }

    # SPA fallback: React Router rotaları için index.html döndür.
    # index.html'i her zaman revalidate ettiriyoruz — aksi halde bir deploy'dan
    # sonra tarayıcı önbelleğinde kalan eski HTML, silinmiş hash'li JS/CSS
    # dosyalarına işaret eder ve kullanıcı beyaz ekran/boş sayfa görür.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Sağlık kontrolü
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets - uzun cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dosya yükleme boyut limiti (PDF RAG için)
    client_max_body_size 100m;

    # API proxy — backend'e yönlendir (CORS yok, tek origin)
    location /api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
        # Hata sayfası yerine raw hata döndür
        proxy_intercept_errors off;
    }

    # SPA fallback: React Router rotaları için index.html döndür
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sağlık kontrolü
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Pushgateway
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # Node Exporter (Linux) - File-based service discovery
  # 45s: 10k hedefte 15s scrape CPU/network baskısını düşürür; self/pgw 15s kalır.
  - job_name: 'node-exporter'
    scrape_interval: 45s
    scrape_timeout: 20s
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/node_exporter_targets.json'
        refresh_interval: 30s

  # Windows Exporter (Windows) - port 9182
  - job_name: 'windows-exporter'
    scrape_interval: 45s
    scrape_timeout: 20s
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/windows_exporter_targets.json'
        refresh_interval: 30s

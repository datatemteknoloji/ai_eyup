# Ortak log sürücüsü — json-file Docker meta timestamp tutar;
# uygulamalar da kendi satırlarına tarih-saat yazar (TZ ile).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # PostgreSQL with TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: server_management_db
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # .env'den alinacak
      POSTGRES_DB: server_management
      # %t = timestamp with milliseconds
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - log_line_prefix=%t [%p] 
      - -c
      - log_timezone=${TZ:-Europe/Istanbul}
      - -c
      - timezone=${TZ:-Europe/Istanbul}
    ports:
      - "5432:5432"
    volumes:
      - /data/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: server_management_redis
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "6379:6379"
    volumes:
      - /data/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: server_management_backend
    logging: *default-logging
    network_mode: "host"
    # .env dosyasındaki TÜM değişkenleri (AGENT_MODEL, AGENT_GUARD_*, REMOTE_LLM_* dahil)
    # container'a geçirir — aksi halde bu ayarlar sadece compose YAML interpolasyonunda
    # kullanılır, container'ın kendi process ortamına hiç ulaşmaz.
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@localhost:5432/server_management
      - REDIS_URL=redis://localhost:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-60}
      - PROMETHEUS_URL=http://localhost:9090
      - PUSHGATEWAY_URL=http://localhost:9091
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin123}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - APP_VERSION=${APP_VERSION:-}
      # RAG reranker (HuggingFace) modeli burada cache'lenir — kalıcı volume
      # olmazsa her container recreate'inde ~2GB model yeniden indirilir.
      - HF_HOME=/app/hf_cache
    volumes:
      - ./backend/app:/app/app
      - ./backend/static:/app/static
      - ./backend/VERSION:/app/VERSION:ro
      - ./prometheus/targets:/prometheus/targets
      - ./prometheus/targets:/etc/prometheus/targets
      - /data/data/chroma:/app/chroma
      - /data/data/repos:/app/repos
      - /data/data/uploads:/app/uploads
      - /data/data/hf_cache:/app/hf_cache
    # OpenShift cluster (ocp.datatem.local) *.local alanı yerel router DNS'inde çözülüyor
    # ama container'ın (network_mode: host olsa da kendi /etc/hosts + daemon DNS'i kullanır)
    # varsayılan DNS'i genel internet sunucularına (8.8.8.8/1.1.1.1) sabit — bu yüzden
    # cluster hostname'leri burada elle eşleniyor.
    extra_hosts:
      - "api.ocp.datatem.local:192.168.1.240"
      - "console-openshift-console.apps.ocp.datatem.local:192.168.1.240"
      - "oauth-openshift.apps.ocp.datatem.local:192.168.1.240"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: server_management_frontend
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: server_management_prometheus
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/targets:/etc/prometheus/targets
      - /data/data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pushgateway
  pushgateway:
    image: prom/pushgateway:latest
    container_name: server_management_pushgateway
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (opsiyonel)
  ollama:
    image: ollama/ollama:latest
    container_name: server_management_ollama
    logging: *default-logging
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - /data/data/ollama:/root/.ollama
    profiles:
      - ollama

# 📌 NOT: .env dosyası oluşturun ve SECRET_KEY, POSTGRES_PASSWORD ayarlayın!
# Örnek: cp .env.example .env && nano .env
# Loglar (Docker meta timestamp ile): ./scripts/compose-logs.sh -f

# Ortak log sürücüsü — json-file Docker meta timestamp tutar;
# uygulamalar da kendi satırlarına tarih-saat yazar (TZ ile).
#
# Dropt Level 1 sidecar bu dosyaya include edilir — tek komut:
#   docker compose up -d
#   docker compose down
include:
  - path: docker-compose.dropt.yml

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # PostgreSQL with TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: server_management_db
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # .env'den alinacak
      POSTGRES_DB: server_management
      # %t = timestamp with milliseconds
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - log_line_prefix=%t [%p] 
      - -c
      - log_timezone=${TZ:-Europe/Istanbul}
      - -c
      - timezone=${TZ:-Europe/Istanbul}
      # Varsayılan max_connections=100, backend'in ana pool'u tek başına
      # (pool_size=40 + max_overflow=80=120) bunu aşıyor; üstüne arka plan
      # thread'leri (health check, log/inventory sync, NLQ collector, Windows
      # log — her biri NullPool ile ayrı bağlantı açan onlarca worker'a kadar
      # çıkabiliyor) ek bağlantı istiyor. 10.000+ sunucu ölçeğinde bu havuzların
      # aynı anda tepe yapması ihtimaline karşı pay artırıldı (300 -> 500).
      # Yetersiz kalırsa istekler "too many clients" hatası alır veya
      # pool_timeout=30s kadar donar — bkz. app/core/database.py. Bu değer
      # artırılınca container yeniden OLUŞTURULMALIDIR (`docker compose up -d
      # --force-recreate db`) — sadece `restart` postgres command'ını yenilemez.
      - -c
      - max_connections=500
    ports:
      - "5432:5432"
    volumes:
      - /data/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: server_management_redis
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "6379:6379"
    volumes:
      - /data/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: server_management_backend
    logging: *default-logging
    network_mode: "host"
    # .env dosyasındaki TÜM değişkenleri (AGENT_MODEL, AGENT_GUARD_*, REMOTE_LLM_* dahil)
    # container'a geçirir — aksi halde bu ayarlar sadece compose YAML interpolasyonunda
    # kullanılır, container'ın kendi process ortamına hiç ulaşmaz.
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@localhost:5432/server_management
      - REDIS_URL=redis://localhost:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-60}
      - PROMETHEUS_URL=http://localhost:9090
      - PUSHGATEWAY_URL=http://localhost:9091
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-Kim13Sun}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - APP_VERSION=${APP_VERSION:-}
      - AINEW_BRIDGE_SECRET=${AINEW_BRIDGE_SECRET:-}
      - DROPT_API_URL=${DROPT_API_URL:-http://127.0.0.1:8001}
      # RAG reranker (HuggingFace) modeli burada cache'lenir — kalıcı volume
      # olmazsa her container recreate'inde ~2GB model yeniden indirilir.
      - HF_HOME=/app/hf_cache
      - RAG_SEED_PATH=${RAG_SEED_PATH:-/app/docs/rag_seed}
      - DOCKER_SOCK=/var/run/docker.sock
      - DROPT_POSTGRES_USER=${DROPT_POSTGRES_USER:-dtt}
      - DROPT_POSTGRES_PASSWORD=${DROPT_POSTGRES_PASSWORD:-}
      - DROPT_POSTGRES_DB=${DROPT_POSTGRES_DB:-dttportal}
      - HOST_ETC_HOSTS=/host-etc-hosts
    volumes:
      - ./backend/app:/app/app
      - ./backend/static:/app/static
      - ./backend/VERSION:/app/VERSION:ro
      - ./docs/rag_seed:/app/docs/rag_seed:ro
      - ./prometheus/targets:/prometheus/targets
      - ./prometheus/targets:/etc/prometheus/targets
      - /data/data/chroma:/app/chroma
      - /data/data/repos:/app/repos
      - /data/data/uploads:/app/uploads
      - /data/data/hf_cache:/app/hf_cache
      # Platform Durumu + tam DB yedek (pg_dump exec)
      - /var/run/docker.sock:/var/run/docker.sock
      # AD / OpenShift hostname — host OS /etc/hosts (dinamik; compose extra_hosts yok)
      - /etc/hosts:/host-etc-hosts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker — bulk health check vb. (Wave 6). Aynı image: backend (rebuild gerekmez).
  worker:
    image: ainew-backend:latest
    container_name: server_management_worker
    logging: *default-logging
    network_mode: "host"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@localhost:5432/server_management
      - REDIS_URL=redis://localhost:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://127.0.0.1:11434}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-Kim13Sun}
      - APP_VERSION=${APP_VERSION:-}
      - HOST_ETC_HOSTS=/host-etc-hosts
    volumes:
      - ./backend/app:/app/app
      - ./backend/VERSION:/app/VERSION:ro
      - /data/data/chroma:/app/chroma
      - /data/data/repos:/app/repos
      - /data/data/uploads:/app/uploads
      - /etc/hosts:/host-etc-hosts:ro
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # Frontend — HTTPS (80→443 redirect). Sertifikalar: ${DATA_DIR}/certs/{server.crt,server.key}
  # Mount yazılabilir: entrypoint eksikse self-signed üretir (ro olsaydı üretemezdi).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: server_management_frontend
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      TLS_CN: ${PRIMARY_IP:-localhost}
      TLS_IP: ${PRIMARY_IP:-}
    ports:
      - "80:80"
      - "443:443"
      # Geriye uyumluluk: eski http://host:3000 → konteyner HTTP (prod nginx 301 → https://host/)
      - "3000:80"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:Z,ro
      - ${DATA_DIR:-/data/data}/certs:/etc/nginx/certs:Z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: server_management_prometheus
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/targets:/etc/prometheus/targets
      - /data/data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pushgateway
  pushgateway:
    image: prom/pushgateway:latest
    container_name: server_management_pushgateway
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (opsiyonel)
  ollama:
    image: ollama/ollama:latest
    container_name: server_management_ollama
    logging: *default-logging
    environment:
      - TZ=${TZ:-Europe/Istanbul}
      - OLLAMA_HOST=http://192.168.1.222:11434
    ports:
      - "11434:11434"
    volumes:
      - /data/data/ollama:/root/.ollama
    profiles:
      - ollama

# 📌 NOT: .env dosyası oluşturun ve SECRET_KEY, POSTGRES_PASSWORD ayarlayın!
# Örnek: cp .env.example .env && nano .env
# Loglar (Docker meta timestamp ile): ./scripts/compose-logs.sh -f

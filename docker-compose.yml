services:
  # PostgreSQL with TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: server_management_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: server_management
    ports:
      - "5432:5432"
    # no dev volumes in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: server_management_redis
    ports:
      - "6379:6379"
    volumes:
      - /var/lib/server_management/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: server_management_backend
    network_mode: "host"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@localhost:5432/server_management
      - REDIS_URL=redis://localhost:6379/0
      - OLLAMA_URL=http://127.0.0.1:11434
      - PROMETHEUS_URL=http://localhost:9090
      - PUSHGATEWAY_URL=http://localhost:9091
    volumes:
      - ./backend/app:/app/app
      - ./backend/static:/app/static
      - ./prometheus/targets:/prometheus/targets
      - ./prometheus/targets:/etc/prometheus/targets
      - /var/lib/server_management/chroma:/var/lib/server_management/chroma
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: server_management_frontend
    ports:
      - "3000:80"
    # production build served by nginx in container
    depends_on:
      - backend

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: server_management_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/targets:/etc/prometheus/targets
      - /var/lib/server_management/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pushgateway
  pushgateway:
    image: prom/pushgateway:latest
    container_name: server_management_pushgateway
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (opsiyonel - açarsanız ağdaki herkes kullanabilir)
  ollama:
    image: ollama/ollama:latest
    container_name: server_management_ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - /var/lib/server_management/ollama:/root/.ollama
    profiles:
      - ollama

# Volumes: /var/lib/server_management/
# Bu sayede Podman/Docker karışımında veri kaybı olmaz

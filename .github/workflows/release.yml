name: Release check

# Offline müşteri paketleri git `dist/` içinden üretilmez.
# Yayın: scripts/build-distribution.sh → scripts/publish-github-release.sh
# (veya scripts/release.sh). Tag push yalnızca Release'in varlığını doğrular.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  confirm-release:
    name: Confirm GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # publish-github-release.sh önce tag push eder, sonra gh release create —
          # kısa bir yarış penceresi olabilir; birkaç kez dene.
          for i in $(seq 1 18); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release bulundu: $TAG"
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
              # En az bir ainew-*.tar.gz asset'i olmalı
              assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
              echo "$assets" | grep -E '^ainew-.*\.tar\.gz$' >/dev/null \
                || { echo "Uyarı: ainew-*.tar.gz asset yok (henüz yükleniyor olabilir)."; exit 1; }
              exit 0
            fi
            echo "Deneme $i/18 — release henüz yok, 10s bekleniyor..."
            sleep 10
          done
          echo "::error::Release $TAG bulunamadı. scripts/publish-github-release.sh ile yayınlayın."
          exit 1

name: Release check

# Offline müşteri paketleri git `dist/` içinden üretilmez.
# Yayın: scripts/build-distribution.sh → scripts/publish-github-release.sh
# (veya scripts/release.sh).
#
# Neden `push: tags` DEĞİL, `release: published`?
#   `gh release create <tag> <1.5 GB tar>` release'i önce TASLAK (draft) açar,
#   yükleme bitince (~30 dk) yayınlar. Tag push'a bağlı kontrol 3 dk bekleyip
#   «release bulunamadı» ile kırmızıya düşüyordu (v1.0.9.42–44). Bu workflow
#   release yayınlandığı anda çalışır; asset zaten yüklenmiş olur.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  confirm-release:
    name: Confirm GitHub Release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Check release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Yayın olayı geldiğinde asset'ler yüklenmiştir; yine de kısa bir tolerans.
          for i in $(seq 1 6); do
            assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' || true)"
            if echo "$assets" | grep -E '^ainew-.*\.tar\.gz$' >/dev/null; then
              echo "Release $TAG asset'leri:"
              echo "$assets"
              echo "$assets" | grep -E '\.sha256$' >/dev/null \
                || echo "::warning::$TAG için .sha256 asset'i yok."
              exit 0
            fi
            echo "Deneme $i/6 — ainew-*.tar.gz henüz listede yok, 10s bekleniyor..."
            sleep 10
          done
          echo "::error::Release $TAG içinde ainew-*.tar.gz asset'i yok."
          exit 1

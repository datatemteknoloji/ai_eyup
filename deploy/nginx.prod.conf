# Production Nginx config — HTTPS (self-signed veya kendi sertifikanız) ile.
# install-rhel.sh tarafından /var/lib/server_management/certs altında üretilen
# sertifika bu dosya ile frontend konteynerine bind-mount edilir (bkz. docker-compose.prod.yml).

# Tarih-saat: log_format http context'te olmalı
log_format timed '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log timed;
    error_log  /var/log/nginx/error.log warn;
    # HTTP -> HTTPS yönlendirme
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    access_log /var/log/nginx/access.log timed;
    error_log  /var/log/nginx/error.log warn;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 100m;

    location /api/v1/terminal/ws/ {
        proxy_pass http://host.docker.internal:8000/api/v1/terminal/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 100m;
        proxy_intercept_errors off;
    }

    # index.html'i her zaman revalidate ettiriyoruz — aksi halde bir deploy'dan
    # sonra tarayıcı önbelleğinde kalan eski HTML, silinmiş hash'li JS/CSS
    # dosyalarına işaret eder ve kullanıcı beyaz ekran/boş sayfa görür.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

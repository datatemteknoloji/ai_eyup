# Dropt Ops sidecar — Level 1 backend (no frontend).
# Ana compose (dev veya prod) bu dosyayı include eder.
# Tek imaj: dropt-api:local (veya DROPT_API_IMAGE) — api + worker aynı imajı paylaşır.
# Ports remapped to avoid ainew (8000/5432/6379/3000).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  dropt-db:
    image: postgres:16-alpine
    pull_policy: ${DROPT_PULL_POLICY:-missing}
    container_name: dropt_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      POSTGRES_USER: ${DROPT_POSTGRES_USER:-dtt}
      POSTGRES_PASSWORD: ${DROPT_POSTGRES_PASSWORD:?DROPT_POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: ${DROPT_POSTGRES_DB:-dttportal}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ${DATA_DIR:-./data}/dropt/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DROPT_POSTGRES_USER:-dtt} -d ${DROPT_POSTGRES_DB:-dttportal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dropt_internal

  dropt-redis:
    image: redis:7-alpine
    pull_policy: ${DROPT_PULL_POLICY:-missing}
    container_name: dropt_redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ${DATA_DIR:-./data}/dropt/redis:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dropt_internal

  dropt-api:
    image: ${DROPT_API_IMAGE:-dropt-api:local}
    pull_policy: ${DROPT_PULL_POLICY:-missing}
    build:
      context: ./dropt/backend
      dockerfile: Dockerfile
    container_name: dropt_api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./dropt/.env
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: postgresql+psycopg://${DROPT_POSTGRES_USER:-dtt}:${DROPT_POSTGRES_PASSWORD}@dropt-db:5432/${DROPT_POSTGRES_DB:-dttportal}
      REDIS_URL: redis://dropt-redis:6379/0
      PORTAL_SSH_KEY_DIR: /ssh-keys
      PORTAL_ARTIFACT_DIR: /artifacts
      PORTAL_KEYTAB_DIR: /keytabs
      PORTAL_CERTS_DIR: /certs
      DOCKER_SOCK: /var/run/docker.sock
      HOST_ETC_HOSTS: /host-etc-hosts
      AINEW_BRIDGE_SECRET: ${AINEW_BRIDGE_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost:3000}
    volumes:
      - ${DATA_DIR:-./data}/dropt/ssh-keys:/ssh-keys:Z
      - ${DATA_DIR:-./data}/dropt/artifacts:/artifacts:Z
      - ${DATA_DIR:-./data}/dropt/keytabs:/keytabs:Z
      - ${DATA_DIR:-./data}/dropt/certs:/certs:Z
      - ${DATA_DIR:-./data}/dropt/rpms:/var/lib/dropt/rpms:Z,ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/hosts:/host-etc-hosts:ro
    # 0.0.0.0: frontend nginx (host.docker.internal) + host-network backend erişir
    ports:
      - "8001:8000"
    depends_on:
      dropt-db:
        condition: service_healthy
      dropt-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dropt_internal

  dropt-worker:
    image: ${DROPT_API_IMAGE:-dropt-api:local}
    pull_policy: ${DROPT_PULL_POLICY:-missing}
    build:
      context: ./dropt/backend
      dockerfile: Dockerfile
    container_name: dropt_worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./dropt/.env
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: postgresql+psycopg://${DROPT_POSTGRES_USER:-dtt}:${DROPT_POSTGRES_PASSWORD}@dropt-db:5432/${DROPT_POSTGRES_DB:-dttportal}
      REDIS_URL: redis://dropt-redis:6379/0
      PORTAL_SSH_KEY_DIR: /ssh-keys
      PORTAL_ARTIFACT_DIR: /artifacts
      AINEW_BRIDGE_SECRET: ${AINEW_BRIDGE_SECRET:-}
    volumes:
      - ${DATA_DIR:-./data}/dropt/ssh-keys:/ssh-keys:Z
      - ${DATA_DIR:-./data}/dropt/artifacts:/artifacts:Z
      - ${DATA_DIR:-./data}/dropt/rpms:/var/lib/dropt/rpms:Z,ro
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      dropt-db:
        condition: service_healthy
      dropt-redis:
        condition: service_healthy
      dropt-api:
        condition: service_healthy
    networks:
      - dropt_internal

networks:
  dropt_internal:
    driver: bridge

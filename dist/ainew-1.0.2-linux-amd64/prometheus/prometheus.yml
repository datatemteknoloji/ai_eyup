global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Pushgateway
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # Node Exporter (Linux) - File-based service discovery
  - job_name: 'node-exporter'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/node_exporter_targets.json'
        refresh_interval: 30s

  # Windows Exporter (Windows) - port 9182
  - job_name: 'windows-exporter'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/windows_exporter_targets.json'
        refresh_interval: 30s

# Automic (UC4) modülü — ayrı Postgres/TimescaleDB (Centrify/Dropt modeli).
# Ana compose (docker-compose.yml) bu dosyayı include eder.
# Port: 5435 (ainew=5432, dropt=5433, centrify=5434 ile çakışmaz).
# Şifre: AUTOMIC_DB_PASSWORD yoksa POSTGRES_PASSWORD kullanılır.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  automic-db:
    image: ${AUTOMIC_DB_IMAGE:-timescale/timescaledb:latest-pg15}
    container_name: automic_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      POSTGRES_USER: ${AUTOMIC_DB_USER:-automic}
      POSTGRES_PASSWORD: ${AUTOMIC_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}}
      POSTGRES_DB: ${AUTOMIC_DB_NAME:-automic}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ${DATA_DIR:-./data}/automic/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTOMIC_DB_USER:-automic} -d ${AUTOMIC_DB_NAME:-automic}"]
      interval: 5s
      timeout: 5s
      retries: 10
